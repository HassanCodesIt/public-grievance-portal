<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" style="background:#f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="0" y="0" width="1000" height="60" fill="#0f172a" />
  <text x="30" y="38" fill="#ffffff" font-size="20" font-weight="700">CM Kerala Public Grievance Redressal Portal — System Architecture</text>
  <text x="970" y="36" fill="#94a3b8" font-size="12" text-anchor="end">Recruitment Prototype · Multi-Tier Architecture</text>

  <!-- Layer 1: Client Presentation -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="940" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="8" height="110" rx="4" fill="#0d9488" />
    <text x="25" y="28" fill="#0f172a" font-size="14" font-weight="700">Presentation Layer — React 19 + TypeScript + Vite + Tailwind CSS v4</text>
    
    <!-- Client Submodules -->
    <rect x="25" y="42" width="205" height="52" rx="6" fill="#f0fdfa" stroke="#ccfbf1" />
    <text x="35" y="62" fill="#0f766e" font-size="12" font-weight="600">Citizen Workspace</text>
    <text x="35" y="78" fill="#64748b" font-size="10">Submit, Track, Feedback, Reopen</text>

    <rect x="250" y="42" width="215" height="52" rx="6" fill="#f0fdfa" stroke="#ccfbf1" />
    <text x="260" y="62" fill="#0f766e" font-size="12" font-weight="600">CMO Admin Dashboard</text>
    <text x="260" y="78" fill="#64748b" font-size="10">Review, Assign, Escalate, ATR Decision</text>

    <rect x="485" y="42" width="205" height="52" rx="6" fill="#f0fdfa" stroke="#ccfbf1" />
    <text x="495" y="62" fill="#0f766e" font-size="12" font-weight="600">Officer Workspace</text>
    <text x="495" y="78" fill="#64748b" font-size="10">Department Queue, Progress, ATR</text>

    <rect x="710" y="42" width="205" height="52" rx="6" fill="#f0fdfa" stroke="#ccfbf1" />
    <text x="720" y="62" fill="#0f766e" font-size="12" font-weight="600">Public Portal &amp; Tracker</text>
    <text x="720" y="78" fill="#64748b" font-size="10">Ref ID Tracking, FAQs, Departments</text>
  </g>

  <!-- Connectors -->
  <line x1="500" y1="190" x2="500" y2="215" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Layer 2: Gateway & Security -->
  <g transform="translate(30, 215)">
    <rect x="0" y="0" width="940" height="75" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="8" height="75" rx="4" fill="#3b82f6" />
    <text x="25" y="24" fill="#0f172a" font-size="14" font-weight="700">Security &amp; Ingestion Gateway</text>
    
    <rect x="25" y="34" width="205" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="127" y="53" fill="#1e40af" font-size="11" text-anchor="middle" font-weight="500">CORS Policy (Configurable Origins)</text>

    <rect x="250" y="34" width="215" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="357" y="53" fill="#1e40af" font-size="11" text-anchor="middle" font-weight="500">IP In-Memory Rate Limiter</text>

    <rect x="485" y="34" width="205" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="587" y="53" fill="#1e40af" font-size="11" text-anchor="middle" font-weight="500">JWT Bearer &amp; RBAC (require_role)</text>

    <rect x="710" y="34" width="205" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="812" y="53" fill="#1e40af" font-size="11" text-anchor="middle" font-weight="500">Magic Bytes Upload Validator (2MB)</text>
  </g>

  <!-- Connectors -->
  <line x1="500" y1="290" x2="500" y2="315" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Layer 3: Application & Business Logic -->
  <g transform="translate(30, 315)">
    <rect x="0" y="0" width="940" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="8" height="150" rx="4" fill="#8b5cf6" />
    <text x="25" y="28" fill="#0f172a" font-size="14" font-weight="700">Application Core — FastAPI + SQLAlchemy 2.0 + Pydantic v2</text>

    <!-- Subservices -->
    <rect x="25" y="45" width="280" height="90" rx="6" fill="#f5f3ff" stroke="#ddd6fe" />
    <text x="35" y="68" fill="#5b21b6" font-size="12" font-weight="700">Workflow State Machine</text>
    <text x="35" y="86" fill="#475569" font-size="10">5 Strictly Enforced Statuses</text>
    <text x="35" y="102" fill="#475569" font-size="10">Submitted → Under Review → In Progress</text>
    <text x="35" y="118" fill="#475569" font-size="10">In Progress → Resolved ⇄ Reopened</text>

    <rect x="330" y="45" width="280" height="90" rx="6" fill="#f5f3ff" stroke="#ddd6fe" />
    <text x="340" y="68" fill="#5b21b6" font-size="12" font-weight="700">AI Grievance Triage &amp; Deduplication</text>
    <text x="340" y="86" fill="#475569" font-size="10">Groq API (openai/gpt-oss-120b)</text>
    <text x="340" y="102" fill="#475569" font-size="10">SHA-256 In-Memory Caching</text>
    <text x="340" y="118" fill="#475569" font-size="10">Labeled Keyword Fallback + difflib</text>

    <rect x="635" y="45" width="280" height="90" rx="6" fill="#f5f3ff" stroke="#ddd6fe" />
    <text x="645" y="68" fill="#5b21b6" font-size="12" font-weight="700">SLA &amp; Audit Engine</text>
    <text x="645" y="86" fill="#475569" font-size="10">SLA Priorities: High (3d), Med (7d), Low (14d)</text>
    <text x="645" y="102" fill="#475569" font-size="10">Automated Overdue Flagging (now &gt; due_at)</text>
    <text x="645" y="118" fill="#475569" font-size="10">Immutable grievance_history logging</text>
  </g>

  <!-- Connectors -->
  <line x1="500" y1="465" x2="500" y2="490" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Layer 4: Persistence & Cloud Services -->
  <g transform="translate(30, 490)">
    <rect x="0" y="0" width="940" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="8" height="120" rx="4" fill="#f59e0b" />
    <text x="25" y="28" fill="#0f172a" font-size="14" font-weight="700">Persistence &amp; External Integrations</text>

    <rect x="25" y="45" width="425" height="60" rx="6" fill="#fffbeb" stroke="#fde68a" />
    <text x="40" y="70" fill="#92400e" font-size="12" font-weight="700">PostgreSQL on Neon (Serverless Relational DB)</text>
    <text x="40" y="88" fill="#78350f" font-size="10">All 10 Relational Tables · pool_pre_ping=True · Internal bytea Attachment Storage</text>

    <rect x="490" y="45" width="425" height="60" rx="6" fill="#fffbeb" stroke="#fde68a" />
    <text x="505" y="70" fill="#92400e" font-size="12" font-weight="700">Groq Cloud Inference API</text>
    <text x="505" y="88" fill="#78350f" font-size="10">openai/gpt-oss-120b Foundation Model · Sub-second LPU Response Time</text>
  </g>
</svg>

